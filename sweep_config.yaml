method: bayes  # Can be 'grid', 'random', or 'bayes'
metric:
  name: eval/f1
  goal: maximize

parameters:
  learning_rate:
    values: [2e-4, 3e-4, 4e-4]
  batch_size:
    values: [4,8,16]
  num_train_epochs:
    values: [7,10]

run_cap: 20
program: train_adapters.py

command:
  - ${env}
  - python
  - ${program}