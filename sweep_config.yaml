method: bayes  # Can be 'grid', 'random', or 'bayes'
metric:
  name: eval/f1
  goal: maximize

parameters:
  learning_rate:
    values: [2e-4, 3e-4]
  batch_size:
    values: [8]
  num_train_epochs:
    values: [10]
  adapter_config_name:
    values: [houlsby,pfeiffer,compacter,custom] # houlsby,pfeiffer,compacter,custom
  #Fusion Layer specific params
  num_train_epochs_fusion:
    values: [7,10]

run_cap: 20
program: train_adapters.py

command:
  - ${env}
  - python
  - ${program}