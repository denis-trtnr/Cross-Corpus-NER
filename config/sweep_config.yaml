method: bayes  # Can be 'grid', 'random', or 'bayes'
metric:
  name: eval/f1
  goal: maximize

parameters:
  learning_rate:
    values: [1e-4, 3e-4, 5e-4]
  batch_size:
    values: [8,16]
  num_train_epochs:
    values: [8,10]
  adapter_config_name:
    values: [pfeiffer,houlsby,custom] # houlsby,pfeiffer,compacter,custom
  #Fusion Layer specific params
  num_train_epochs_fusion:
    values: [8, 10, 12]
  #Custom Config specific params
  #non_linearity:
  #  values: ["relu","gelu"]
  #reduction_factor:
  #  values: [8, 16]
  #dropout:
  #  values: [0.1, 0.15]
  #init_weights:
  #  values: ["bert"]
  #residual_before_ln:
  #  values: [True]
  #mh_adapter:
  #  values: [True, False]

run_cap: 20
program: src/main.py

command:
  - ${env}
  - python
  - ${program}